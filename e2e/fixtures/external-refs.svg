<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 100 100">
  <!--
    NFR-030 / FR-005 の E2E 用フィクスチャ（Task 8.2 scenario 5）。
    3 種類の外部参照（image href / use href / script）を仕込む。
    src/sources/svg.ts はこれらを「取得せず破棄する」契約（同ファイル 1297〜1299 行目の
    DISCARD_REASONS）なので、このテストはブラウザが実際に一切のリクエストを
    外部へ送らないことを確認する。閉じたパスを 1 つ含めておき、
    パーサが正常系として処理できる形にしてある（拒否されても本テストの
    主張は成立するが、可能なら成功系のほうが「取得せず破棄」の経路を通る）。
  -->
  <image href="https://example.invalid/should-not-be-fetched.png" x="0" y="0" width="10" height="10" />
  <use xlink:href="https://example.invalid/should-not-be-fetched.svg#shape" x="0" y="0" />
  <script type="text/javascript">
    // eslint 対象外（SVG 内の文字列。パーサは実行しない）
    window.location = 'https://example.invalid/should-not-navigate';
  </script>
  <path d="M 10 10 L 90 10 L 90 90 L 10 90 Z" fill="black" />
</svg>
